<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250">
  <style>text{font-family:Arial,sans-serif;font-size:18px;fill:#111}.box{fill:#fff5f5;stroke:#c53030;stroke-width:2;rx:7}.ok{fill:#f0fff4;stroke:#2f855a;stroke-width:2;rx:7}.arrow{stroke:#333;stroke-width:2.5;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
  <rect class="box" x="20" y="40" width="230" height="70"/><text x="42" y="70">Lead-off / flatline /</text><text x="55" y="95">clipping / packet loss</text>
  <line class="arrow" x1="250" y1="75" x2="320" y2="75"/>
  <rect class="box" x="320" y="40" width="160" height="70"/><text x="352" y="70">unreliable</text><text x="341" y="95">suppress all</text>
  <rect class="ok" x="320" y="145" width="160" height="70"/><text x="345" y="175">usable SQI</text><text x="338" y="200">allow modules</text>
  <line class="arrow" x1="480" y1="180" x2="560" y2="180"/>
  <rect class="ok" x="560" y="145" width="180" height="70"/><text x="582" y="175">QRS / HR</text><text x="577" y="200">PQRST if high</text>
  <line class="arrow" x1="740" y1="180" x2="820" y2="180"/>
  <rect class="ok" x="820" y="145" width="150" height="70"/><text x="842" y="175">Warnings</text><text x="839" y="200">ML advisory</text>
</svg>
